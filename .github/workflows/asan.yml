# ASan / UBSan — Runtime Memory Safety via LLVM/Clang (MSYS2 CLANG64)
#
# MinGW-w64 GCC does not ship libasan or libubsan — those sanitizer runtimes
# depend on POSIX signals and /proc/self/maps and are not ported to Windows.
#
# LLVM's compiler-rt *does* work on Windows. It uses VirtualQuery and
# structured-exception-handling instead of POSIX signals. The MSYS2 CLANG64
# environment ships both clang++ and the compiler-rt package that contains
# clang_rt.asan-x86_64.dll, making it the only reliable path for ASan on
# Windows without MSVC.
#
# Clang in CLANG64 targets x86_64-w64-mingw32, so __attribute__((sysv_abi))
# is fully supported — the ABI invariant required by every host export in
# core/ is preserved.
#
# Why we configure cmake directly instead of using --preset asan:
#   The asan CMakePreset inherits from base, which sets the MinGW-GCC
#   toolchain file (cmake/toolchains/mingw-gcc15.cmake). That file asserts
#   GCC 15.2 and rejects any other compiler. Rather than adding a parallel
#   preset hierarchy for Clang, we pass flags directly here so the workflow
#   is self-contained and the CMakePresets.json stays clean.
#
# No external tokens required. Uses automatic GITHUB_TOKEN (contents: read).
# Runs safely on fork PRs because it only reads the checked-out source.

name: ASan / UBSan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sanitize:
    name: ASan + UBSan (LLVM/Clang, MSYS2 CLANG64)
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Submodule cache ────────────────────────────────────────────────────
      - name: Cache git submodules
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: submodules-${{ hashFiles('.gitmodules') }}

      - name: Update submodules
        shell: pwsh
        run: git submodule update --init --recursive

      # ── MSYS2 CLANG64 ─────────────────────────────────────────────────────
      # CLANG64 is MSYS2's fully LLVM-based Windows environment. It provides
      # clang / clang++ targeting x86_64-w64-mingw32, and the compiler-rt
      # package which ships clang_rt.asan-x86_64.dll — the LLVM ASan runtime
      # for Windows. No libasan needed.
      #
      # cache: true — msys2/setup-msys2 persists the pacman package download
      # cache via actions/cache keyed on the package list + msys2 version.
      # On a cache hit the packages install from disk instead of the network.
      # Saves 3–5 min on every run after the first.

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          cache: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-compiler-rt
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-ccache

      # ── Verify toolchain ───────────────────────────────────────────────────
      - name: Verify Clang and ASan runtime availability
        shell: msys2 {0}
        run: |
          clang++ --version
          # Confirm the ASan runtime DLL is present before attempting a build.
          # If this fails, the compiler-rt package is missing or mismatched.
          find /clang64/lib/clang -name "clang_rt.asan*" 2>/dev/null \
            | grep -q . && echo "ASan runtime: found" \
            || (echo "ASan runtime: NOT FOUND — check compiler-rt package" && exit 1)

      # ── Configure ─────────────────────────────────────────────────────────
      # We pass all flags explicitly rather than using --preset asan, because
      # that preset inherits the GCC-only toolchain file. Clang needs a clean
      # configure with no toolchain constraints beyond what we specify here.
      #
      # -fsanitize=address,undefined : enable ASan + UBSan
      # -fno-omit-frame-pointer      : preserve frame pointers for readable
      #                                ASan stack traces on Windows
      # -g                           : debug info for source-level diagnostics
      # PORTPS5_COMPILE_WARNING_AS_ERROR=ON mirrors the ci preset so we catch
      # any Clang-specific warnings that GCC silently accepts.

      - name: Configure ccache (Clang)
        shell: msys2 {0}
        run: |
          # Use a separate ccache key from the GCC CI job — the object files
          # are incompatible between compilers.
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache-asan" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"    >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=512M"                 >> $GITHUB_ENV

      - name: Restore ccache (Clang/ASan)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache-asan
          key: ccache-asan-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-asan-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}-
            ccache-asan-${{ runner.os }}-${{ github.ref }}-
            ccache-asan-${{ runner.os }}-refs/heads/${{ github.base_ref }}-
            ccache-asan-${{ runner.os }}-refs/heads/main-
            ccache-asan-${{ runner.os }}-

      - name: Configure (Clang + ASan/UBSan)
        shell: msys2 {0}
        run: |
          cmake -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DBUILD_TESTING=ON \
            -DANYPS5_ENABLE_SPIRV_TOOLS=ON \
            -DPORTPS5_COMPILE_WARNING_AS_ERROR=ON \
            -B build/asan \
            .

      - name: Build
        shell: msys2 {0}
        run: cmake --build build/asan --parallel

      - name: Save ccache (Clang/ASan)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache-asan
          key: ccache-asan-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}-${{ github.run_attempt }}

      # ── Run tests ──────────────────────────────────────────────────────────
      # halt_on_error=1    — stop on the first sanitizer finding rather than
      #                      accumulating errors; keeps the log readable.
      # abort_on_error=1   — exit via abort() so ctest records FAILED
      #                      (non-zero exit) rather than letting execution
      #                      continue past the first violation.
      # print_stacktrace=1 — emit a symbolised stack trace for UBSan findings.
      #
      # The ASan runtime DLL (clang_rt.asan-x86_64.dll) must be on PATH at
      # test run time. msys2/setup-msys2 adds /clang64/bin to PATH for the
      # msys2 shell, so this is handled automatically.

      - name: Run unit tests under ASan / UBSan
        shell: msys2 {0}
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stats=1
          UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build/asan \
            --label-regex "^unit$" \
            --output-on-failure \
            --parallel 1
