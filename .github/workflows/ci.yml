name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Change detection (fast ubuntu job) ───────────────────────────────
  # Skips the expensive Windows build when a PR/push touches no code:
  # docs-only edits (*.md, config/games/, progress badges) finish here in
  # ~15 s instead of consuming ~20 min of windows-2022 minutes.
  # docs/workarounds.md IS a code path (policy check cross-references the
  # PORTPS5_WORKAROUND registry), so it counts as code.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            RANGE="$BASE...HEAD"
          else
            if [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
              RANGE="${{ github.event.before }} ${{ github.sha }}"
            else
              RANGE="HEAD~1 HEAD"
            fi
          fi
          echo "Diff range: $RANGE"
          # shellcheck disable=SC2086
          CHANGED=$(git diff --name-only $RANGE || true)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(core/|tools/|tests/|cmake/|3rdparty/|CMakeLists\.txt|CMakePresets\.json|pyproject\.toml|uv\.lock|\.gitmodules|\.github/workflows/ci\.yml|\.github/actions/|docs/workarounds\.md|tests/expected-count|docs/Doxyfile)'; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected — Windows build will run."
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "Docs/config-only change — Windows build will be skipped."
          fi

  build_and_test:
    name: Build & Test (MinGW GCC 15.2)
    runs-on: windows-2022
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
          # Depth 2 so HEAD~1 (PR base or previous main) exists for the
          # comment-policy diff below.
          fetch-depth: 2

      - name: Setup MinGW + submodules + ccache env
        uses: ./.github/actions/mingw-setup

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          # Stable key on toolchain + build definition: reuses compilation
          # results across runs. The old per-SHA key
          # (…-${{ github.sha }}-${{ github.run_attempt }}) could never hit
          # and wrote a fresh 1 GB entry every run, thrashing the 10 GB
          # account cache. Prefix fallback still shares warm objects with
          # main for PRs that touch no build definition.
          key: ccache-${{ runner.os }}-ci-${{ hashFiles('cmake/toolchains/mingw-gcc15.cmake', 'cmake/toolchains/mingw-gcc15.sha256', 'CMakePresets.json', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-ci-
            ccache-${{ runner.os }}-refs/heads/main-
            ccache-${{ runner.os }}-

      - name: Verify toolchain
        shell: pwsh
        run: |
          gcc --version
          g++ --version
          ninja --version
          cmake --version
          python --version
          ccache --version
          ccache -z
          ccache -s

      - name: Configure CMake (ci preset)
        run: cmake --preset ci

      - name: Build (ci preset)
        run: cmake --build --preset ci

      - name: Show ccache stats
        shell: pwsh
        run: ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-ci-${{ hashFiles('cmake/toolchains/mingw-gcc15.cmake', 'cmake/toolchains/mingw-gcc15.sha256', 'CMakePresets.json', 'CMakeLists.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run Unit Tests (ctest --preset ci)
        # Parallel: the 218 unit tests are host-only with no shared state —
        # file fixtures use timestamp-unique dirs and timing asserts are
        # lower-bounds (load only makes them pass by more). Serial ctest
        # (~4 min, mostly per-test process spawns) was the job's long pole.
        env:
          CTEST_PARALLEL_LEVEL: 4
        run: ctest --preset ci

      - name: Gate test count
        shell: pwsh
        run: |
          $expectedCount = [int](Get-Content tests/expected-count).Trim()
          $testList = ctest --preset ci -N
          $match = [regex]::Match($testList, 'Total Tests: (\d+)')
          if ($match.Success) {
              $actualCount = [int]$match.Groups[1].Value
              Write-Host "Found $actualCount tests (expected at least $expectedCount)"
              if ($actualCount -lt $expectedCount) {
                  throw "Test count shrunk! Expected at least $expectedCount, but found $actualCount"
              }
          } else {
              throw "Could not determine test count from ctest output"
          }

      # ── Golden corpus (merged, incremental) ──────────────────────────
      # Previously a second windows-2022 job that re-ran checkout, MinGW
      # setup, cmake configure and a partial build from a cold cache. The
      # full `cmake --build --preset ci` above already compiles
      # recompiler_golden_tests and agc_shader_replay, so this rebuild is
      # an incremental no-op and the corpus replay adds ~1-2 min instead
      # of a second ~15 min runner.
      - name: Replay golden corpus (ctest)
        run: ctest --preset golden

      - name: Replay golden corpus (agc_shader_replay --golden)
        shell: pwsh
        run: |
          $replay = Get-ChildItem -Recurse -Path build/ci -Filter agc_shader_replay.exe | Select-Object -First 1
          if ($null -eq $replay) {
              throw "agc_shader_replay.exe not found under build/ci"
          }
          & $replay.FullName --golden core/shader/recompiler/tests/golden/corpus
          if ($LASTEXITCODE -ne 0) {
              throw "agc_shader_replay --golden failed with exit code $LASTEXITCODE"
          }

      - name: Policy checks
        shell: pwsh
        run: |
          Write-Host "Running policy checks..."
          
          # 1. No glslang symbols in libSceAgcDriver.prx
          $driverPrx = "build/ci/core/libs/libs/libSceAgcDriver.prx"
          if (Test-Path $driverPrx) {
              $symbols = & nm -D $driverPrx 2>$null
              $glslangSyms = $symbols | Select-String -Pattern "glslang"
              if ($glslangSyms) {
                  throw "glslang symbol found in release libSceAgcDriver.prx: $glslangSyms"
              }
              Write-Host "Policy pass: glslang is absent from libSceAgcDriver.prx"
          }

          # 2. No title hacks in core/
          $titleHacks = git grep -n -E "PPSA[0-9]{5}|CUSA[0-9]{5}" core/ 2>$null | Where-Object {
              $_ -notmatch '/tests/'
          }
          # git grep exits with 1 when no matches are found; reset exit code as this represents policy pass.
          $global:LASTEXITCODE = 0
          if ($titleHacks) {
              throw "Forbidden title-ID found in core/: $titleHacks"
          }
          Write-Host "Policy pass: No title-IDs found in core/"

          # 3. No APS5_ string literals outside the Config module. The Config
          # module alone may name the prefix to warn about stale variables.
          $aps5Literals = git grep -n '"APS5_' -- core/ 2>$null | Where-Object {
              $_ -notmatch 'core/libs/prx/libc/src/Config\.cpp'
          }
          # git grep exits with 1 when no matches are found; reset exit code as this represents policy pass.
          $global:LASTEXITCODE = 0
          if ($aps5Literals) {
              throw "Forbidden APS5_ string literal outside Config module: $aps5Literals"
          }
          Write-Host "Policy pass: No APS5_ literals outside the Config module"

          # 4. No getenv() calls in production code outside the Config module.
          # Test sources under */tests/ are exempt: they verify environment
          # behavior without changing runtime behavior (see spec/verification.md).
          $getenvCalls = git grep -n -E '\bgetenv\s*\(' -- core/ 2>$null | Where-Object {
              $_ -notmatch 'core/libs/prx/libc/src/Config\.cpp' -and $_ -notmatch '/tests/'
          }
          # git grep exits with 1 when no matches are found; reset exit code as this represents policy pass.
          $global:LASTEXITCODE = 0
          if ($getenvCalls) {
              throw "Forbidden getenv() call outside Config module: $getenvCalls"
          }
          Write-Host "Policy pass: No getenv() calls outside the Config module"

          # 5. Workaround registry matches docs/workarounds.md in both
          # directions, and key names describe mechanisms (snake_case, no
          # title names or title-ID patterns). Test sources are exempt: their
          # keys never ship. git grep prints path:line:content (no -h), so the
          # filters below see the file path; the macro definition itself is
          # excluded by name, and commented-out lines (// or # comments) are
          # not real registrations.
          $registered = git grep -E 'PORTPS5_WORKAROUND\(' -- core/ 2>$null | Where-Object {
              $_ -notmatch '/tests/' -and $_ -notmatch '#define PORTPS5_WORKAROUND' -and
                  $_ -notmatch ':[0-9]+:\s*(//|#)'
          } | ForEach-Object {
              if ($_ -match 'PORTPS5_WORKAROUND\(\s*([A-Za-z0-9_]+)') { $Matches[1] }
          } | Sort-Object -Unique
          # git grep exits with 1 when no matches are found; reset exit code as this represents policy pass.
          $global:LASTEXITCODE = 0
          $documented = Select-String -Path docs/workarounds.md -Pattern '^\| `([a-z0-9_]+)`' -AllMatches |
              ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } |
              Sort-Object -Unique
          foreach ($key in $registered) {
              if ($documented -notcontains $key) {
                  throw "Workaround '$key' is registered in code but missing from docs/workarounds.md"
              }
              if ($key -notmatch '^[a-z][a-z0-9_]*$' -or $key -match '(PPSA|CUSA)[0-9]') {
                  throw "Workaround key '$key' must be snake_case and free of title references"
              }
          }
          foreach ($key in $documented) {
              if ($registered -notcontains $key) {
                  throw "Workaround '$key' is documented but not registered in code"
              }
          }
          Write-Host "Policy pass: Workaround registry matches docs/workarounds.md"

      - name: Verify code comments and best practices
        shell: pwsh
        run: |
          Write-Host "Running code comment and docstring policy checks..."
          # Diff against HEAD~1, not origin/main: a shallow checkout has no
          # merge-base with origin/main, so the triple-dot diff failed and the
          # fallback two-dot diff flagged every file main gained after the PR
          # branched (unrelated audio files). HEAD~1 is the PR base on the merge
          # ref and the previous commit on a main push.
          python tools/check_comments.py --base HEAD~1

      # ── Build hashes (provenance, no uploads) ────────────────────────
      # SHA256 over shipping binaries for release provenance and
      # "did CI build what I think it built" triage. Summary-only: no
      # artifact upload, no game data, <10 s. Missing files are a warning,
      # not a failure, so preset renames cannot red the build.
      - name: Hash shipping binaries (SHA256 summary)
        shell: pwsh
        run: |
          $targets = @(
            "build/ci/relinker/Release/relinker.exe",
            "build/ci/relinker/relinker.exe",
            "build/ci/core/libs/libs/libSceAgcDriver.prx"
          )
          $replay = Get-ChildItem -Recurse -Path build/ci -Filter agc_shader_replay.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $replay) { $targets += $replay.FullName }
          $found = $false
          "### Build hashes (SHA256)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          # NOTE: single quotes below — in double quotes the backticks would
          # escape the closing quote and leave the string unterminated.
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          foreach ($t in $targets) {
            if (Test-Path $t) {
              $h = (Get-FileHash -Path $t -Algorithm SHA256).Hash.ToLowerInvariant()
              $line = "$h  $t"
              Write-Host $line
              $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              $found = $true
            } else {
              Write-Host "::warning::hash target not found (skipped): $t"
            }
          }
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if (-not $found) {
            Write-Host "::warning::no shipping binaries found to hash under build/ci"
          }

  python_quality:
    name: Python quality (uv, ruff, pytest, coverage)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.8.12"
          python-version: "3.13"

      - name: Lint (ruff check)
        run: uv run --locked --group dev ruff check tools/ tests/tools/ core/relinker/relinker/tests/ core/libs/tests/run_exception_tests.py

      - name: Format (ruff format --check)
        run: uv run --locked --group dev ruff format --check tools/ tests/tools/ core/relinker/relinker/tests/ core/libs/tests/run_exception_tests.py

      - name: Test with coverage (pytest)
        run: uv run --locked --group dev pytest tests/tools --cov=tools --cov-report=term-missing
