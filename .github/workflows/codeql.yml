# GitHub CodeQL — Static Analysis Security Testing (SAST)
#
# Runs on every push to main, every pull request, and weekly schedule (cron),
# using only the ephemeral GITHUB_TOKEN (no external secrets needed).
# Results appear in the GitHub Security → Code scanning alerts tab.
#
# 3-Way Hybrid Architecture:
# 1. Pull requests (build-mode: none):
#    - Fast zero-build AST scanning directly from repository source files in ~1.5–2 min.
#    - Skips MinGW GCC download/setup and CMake compilation (submodules still
#      sync so the AST extractor can resolve third-party headers).
#    - Satisfies the required "CodeQL C/C++ Analysis" status check in repo ruleset protect-main.
# 2. Main branch push (build-mode: manual):
#    - Deep compiler-interception dataflow analysis building shipping targets (relinker, libs)
#      with the pinned MinGW GCC 15.2 toolchain.
#    - Runs asynchronously in the background on main without blocking developer PRs.
# 3. Weekly scheduled cron (build-mode: manual):
#    - Full deep manual build analysis to surface any newly published CodeQL query
#      packs, CWE coverage, and security advisories even with no code changes that week.
#
# The analysis intentionally targets only the source files we write (core/,
# tools/) and skips third-party submodules (SDL2, Vulkan-Headers, glslang,
# SPIRV-Tools, LibAtrac9, VulkanMemoryAllocator, tomlplusplus). Those are
# controlled by pinned commits and verified by checksum; scanning them would
# produce third-party noise we cannot fix.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan on Monday at 08:00 UTC so that new CodeQL query packs
    # surface vulnerabilities even when no code changes land that week.
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: CodeQL C/C++ Analysis
    runs-on: windows-2022
    # CodeQL needs read on contents to checkout and write on security-events
    # to upload SARIF results. Both are available on public repos via the
    # automatic GITHUB_TOKEN — no personal token or external secret required.
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      # ── Prerequisites (shared composite action) ────────────────────────
      # Submodules always (AST extractor needs headers to resolve includes).
      # MinGW toolchain only for main/cron deep builds; PR fast scans use
      # build-mode 'none' and never invoke the compiler.
      - name: Setup submodules + MinGW (deep builds only)
        uses: ./.github/actions/mingw-setup
        with:
          setup-toolchain: ${{ github.event_name != 'pull_request' }}

      # ── CodeQL ─────────────────────────────────────────────────────────────
      # Hybrid analysis mode:
      # - PRs (build-mode: none): Fast zero-build AST extraction runs directly
      #   on checkout without compiler interception or build prerequisites (~1-2m).
      # - Main / cron (build-mode: manual): Compiler tracing intercepts gcc/g++
      #   invocations during build for deep interprocedural dataflow analysis.
      #
      # Query suite: security-extended includes all security queries in the
      # standard suite plus additional experimental queries for C/C++. It
      # covers the OWASP Top 10, CWE/SANS Top 25, and CERT C rules.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: ${{ github.event_name == 'pull_request' && 'none' || 'manual' }}
          # security-extended adds pointer arithmetic, numeric overflow, and
          # format-string injection queries on top of the default security suite.
          queries: security-extended
          # Skip third-party submodule directories. CodeQL still sees their
          # headers when resolving includes during the project build, but it
          # does not create alerts for code we do not maintain.
          config: |
            paths-ignore:
              - 3rdparty/
              - SDL2/
              - Vulkan-Headers/
              - SPIRV-Headers/
              - SPIRV-Tools/
              - glslang/
              - VulkanMemoryAllocator/
              - LibAtrac9/

      - name: Build project for CodeQL (main/cron deep build only)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          # ANYPS5_ENABLE_SPIRV_TOOLS=OFF excludes SPIRV-Tools, glslang and
          # related third-party submodules from the build entirely. CodeQL
          # intercepts compiler invocations to build its semantic database;
          # paths-ignore in the init config filters *alerts* at analysis time
          # but cannot prevent CodeQL from extracting sources that were
          # actually compiled. Disabling the SPIRV-Tools build is the only
          # reliable way to ensure third-party code never enters the database.
          # The shader recompiler and core/ sources that call into SPIRV-Tools
          # are still compiled and analysed — only the SPIRV-Tools library
          # itself is omitted.
          #
          # BUILD_TESTING=OFF skips test binary compilation; test sources
          # share the same code paths as production targets and add no
          # analysis value.
          #
          # CMAKE_BUILD_TYPE=Release instead of RelWithDebInfo: CodeQL
          # extracts semantic data (AST, call graph, dataflow) at compiler
          # IR level — before code generation and before debug-info emission.
          # DWARF/PDB generation is wasted time in the CodeQL context and
          # skipping it noticeably reduces build duration. Release optimisations
          # also expose more dataflow paths for CodeQL's taint-tracking queries.
          #
          # ccache is intentionally NOT used: CodeQL works by intercepting
          # compiler invocations live. A ccache hit bypasses the real compiler,
          # so CodeQL sees no AST for that translation unit and its database
          # entry for the file stays empty. Every file must be compiled fresh.
          #
          # Compiles ONLY shipping binaries (--target relinker libs) to minimize
          # compilation time and avoid building auxiliary developer tools.
          cmake --preset ci `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER="" `
            -DCMAKE_CXX_COMPILER_LAUNCHER="" `
            -DANYPS5_ENABLE_SPIRV_TOOLS=OFF `
            -DBUILD_TESTING=OFF
          cmake --build build/ci --target relinker libs

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
          # Upload SARIF to GitHub Security tab. On public repositories this
          # is free and unlimited; alerts appear inline on pull requests.
          upload: true
