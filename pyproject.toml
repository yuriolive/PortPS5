# PortPS5 Python tooling (tools/, tests/tools/, relinker self-tests).
#
# Managed with uv (astral): `uv sync --group dev` installs pytest, pytest-cov
# and ruff pinned by uv.lock. CI runs `uv run --group dev ruff check`,
# `uv run --group dev ruff format --check` and pytest with coverage.
# Hosted unit execution through ctest keeps working with stdlib unittest.

[project]
name = "portps5-tools"
version = "0.1.0"
description = "Python tooling and self-tests for PortPS5"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PIE", "RUF", "ISC", "FURB", "PLW1510", "D100", "D101", "D102", "D103", "D104", "D105", "D107"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["check_comments", "progress", "regress", "regress_metrics"]

# Test methods and pytest test functions (test_*) are self-describing by name; helper functions,
# modules, classes and packages still require docstrings everywhere.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D102", "D103"]
"core/**/tests/**" = ["D102"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests/tools"]
addopts = ["-p", "no:cacheprovider"]

[tool.coverage.run]
source = ["tools"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
