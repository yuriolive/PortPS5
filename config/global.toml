# PortPS5 global configuration (docs/spec/configuration.md).
#
# The relinker CLI copies this directory next to the converted executable at
# conversion time. The runtime reads global.toml first, then
# games/<titleId>.toml, then PORTPS5_DEBUG, key by key. Unknown keys, wrong
# types and out-of-range values are start-up errors. [workarounds] is only
# allowed in game files. Every value below is the default; deleting the file
# keeps these defaults with one warning.

schema = 1

[display]
# Internal render-target scale. The 1.0 performance bar is measured at 1.0.
resolution_scale = 1.0
# Swapchain present mode. Falls back to fifo with a warning if unsupported.
present_mode = "fifo"
fullscreen = false
# Initial window size as a share of the display (25-100).
window_percent = 60

[input]
# Host radial dead zone for sticks (0.0-0.5).
deadzone = 0.08
mouse_look = false
# Replaces the old Pad::MouseSensitivity (0.1-10.0).
mouse_sensitivity = 1.0
# Swap Cross and Circle for controllers only.
swap_confirm = false
# Keyboard/mouse bindings: binding key to SDL scancode names or
# MouseLeft/MouseRight/MouseMiddle/MouseX1/MouseX2/WheelUp/WheelDown.
# This table mirrors the previous compile-time InputMapping.
[input.bindings]
toggle_fullscreen = ["F11"]
cross = ["Return", "Space"]
options = ["Escape"]
triangle = ["I"]
circle = ["C"]
l1 = ["Q"]
r1 = ["E", "Left Alt", "Right Alt"]
l3 = ["Left Shift", "Right Shift"]
r3 = ["Left Control", "Right Control"]
up = ["Up", "WheelUp"]
right = ["Right"]
down = ["Down", "WheelDown"]
left = ["Left"]
left_stick_left = ["A"]
left_stick_right = ["D"]
left_stick_up = ["W"]
left_stick_down = ["S"]
right_stick_left = ["F"]
right_stick_right = ["H"]
right_stick_up = ["T"]
right_stick_down = ["G"]
touch_left = ["Backspace"]
touch_right = ["Tab"]
toggle_mouse = ["MouseMiddle"]
square = ["MouseLeft"]
r2 = ["MouseRight"]

# No [debug] section is shipped: [debug] keys are diagnostic or override only,
# a release run must not set any, and the results JSON records every key that
# is set. Built-in defaults (log_level "info", everything else off/empty) come
# from the Config module. Uncomment a key below only for local diagnostics;
# never ship a global.toml with [debug] keys set.
